<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ورود | CRM رانندگان کسبی</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: Tahoma, Vazir, sans-serif;
    background: #0f172a;
    display: flex; align-items: center; justify-content: center;
    height: 100vh; margin: 0;
  }
  .box {
    background: #fff; border-radius: 14px; padding: 32px 28px;
    width: 340px; box-shadow: 0 10px 40px rgba(0,0,0,.3);
  }
  h1 { font-size: 18px; text-align: center; color: #0f172a; margin-bottom: 4px; }
  p.sub { text-align: center; color: #64748b; font-size: 13px; margin-top: 0; margin-bottom: 22px; }
  label { font-size: 13px; color: #334155; display:block; margin-bottom: 6px; }
  input {
    width: 100%; padding: 10px 12px; margin-bottom: 14px;
    border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px;
  }
  button {
    width: 100%; padding: 11px; background: #2563eb; color: #fff;
    border: none; border-radius: 8px; font-size: 15px; cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: not-allowed; }
  #err { color: #dc2626; font-size: 13px; text-align: center; margin-top: 10px; min-height: 16px; }
</style>
</head>
<body>
  <div class="box">
    <h1>CRM تماس و تخصیص سفر رانندگان</h1>
    <p class="sub">با یوزر تیمی خودت وارد شو</p>
    <label>ایمیل کاربری</label>
    <input id="email" type="email" placeholder="name@kasbi.local" autocomplete="username">
    <label>رمز عبور</label>
    <input id="pass" type="password" placeholder="••••••••" autocomplete="current-password">
    <button id="loginBtn" onclick="doLogin()">ورود</button>
    <div id="err"></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script>
    const errBoxGlobal = document.getElementById('err');
    let auth = null;
    if (typeof firebase === 'undefined') {
      errBoxGlobal.textContent = 'اسکریپت‌های Firebase بارگذاری نشد — احتمالاً مشکل اینترنت/فیلترینگ. VPN رو روشن و متصل کن، بعد صفحه رو با Ctrl+Shift+R رفرش کن.';
    } else {
      firebase.initializeApp(firebaseConfig);
      auth = firebase.auth();
      // اگر قبلاً لاگین کرده مستقیم بره به اپ (مگر اینکه از خود اپ برگردونده شده باشه، تا حلقه‌ی رفت‌وبرگشت نسازه)
      const noAuto = new URLSearchParams(window.location.search).has('noauto');
      if (!noAuto) {
        auth.onAuthStateChanged(user => {
          if (user) window.location.href = "app.html";
        });
      }
    }

    function doLogin() {
      const email = document.getElementById('email').value.trim();
      const pass = document.getElementById('pass').value;
      const errBox = document.getElementById('err');
      const btn = document.getElementById('loginBtn');
      errBox.textContent = '';
      if (!auth) { errBox.textContent = 'Firebase بارگذاری نشده — VPN رو چک کن و صفحه رو رفرش کن (Ctrl+Shift+R).'; return; }
      if (!email || !pass) { errBox.textContent = 'ایمیل و رمز عبور رو وارد کن'; return; }
      btn.disabled = true; btn.textContent = 'در حال ورود...';
      errBox.textContent = 'در حال اتصال به سرور...';

      const timer = setTimeout(() => {
        errBox.textContent = 'پاسخی از سرور نیومد (بیش از ۲۰ ثانیه) — احتمالاً VPN قطعه یا کنده. VPN رو چک کن (روشن و متصل باشه) و دوباره امتحان کن.';
        btn.disabled = false; btn.textContent = 'ورود';
      }, 20000);

      auth.signInWithEmailAndPassword(email, pass)
        .then(() => { clearTimeout(timer); window.location.href = "app.html"; })
        .catch(e => {
          clearTimeout(timer);
          console.error('Login error:', e);
          const messages = {
            'auth/network-request-failed': 'مشکل شبکه/اینترنت — اتصال به سرور برقرار نشد. VPN رو چک کن (روشن و متصل باشه) و دوباره امتحان کن.',
            'auth/wrong-password': 'رمز عبور اشتباهه',
            'auth/invalid-credential': 'ایمیل یا رمز اشتباهه',
            'auth/user-not-found': 'این ایمیل توی سیستم ثبت نشده',
            'auth/too-many-requests': 'چندبار اشتباه وارد کردی، چند دقیقه صبر کن و دوباره امتحان کن',
            'auth/invalid-email': 'فرمت ایمیل درست نیست'
          };
          errBox.textContent = 'ورود ناموفق: ' + (messages[e.code] || (e.code + ' — ' + e.message));
          btn.disabled = false; btn.textContent = 'ورود';
        });
    }
    document.getElementById('pass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  </script>
</body>
</html>
